name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install build dependencies
        run: |
          sudo rm -f /usr/lib/python3.12/EXTERNALLY-MANAGED
          sudo apt-get update
          # libffi recipe NEEDS: automake, autoconf, libltdl-dev (per p4a source)
          sudo apt-get install -y python3-pip python3-dev zip unzip \
            autoconf automake libtool libtool-bin libltdl-dev m4 pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libssl-dev libglib2.0-dev
          pip3 install buildozer cython==0.29.37

      - name: Pre-accept all Android SDK licenses
        run: |
          mkdir -p /tmp/android-licenses && cd /tmp/android-licenses
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d .
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "Licenses pre-accepted"

      - name: Build APK with Buildozer
        run: |
          cd "${GITHUB_WORKSPACE}"
          echo "y" | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: student-checkin-apk
          path: bin/*.apk
