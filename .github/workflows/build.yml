name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install build dependencies
        run: |
          sudo rm -f /usr/lib/python3.12/EXTERNALLY-MANAGED
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dev zip unzip \
            autoconf automake libtool libtool-bin libltdl-dev m4 pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libssl-dev libglib2.0-dev
          pip3 install buildozer cython==0.29.37

      - name: Pre-accept all Android SDK licenses
        run: |
          mkdir -p /tmp/android-licenses && cd /tmp/android-licenses
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d .
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "Licenses pre-accepted"

      - name: Pre-clone and patch python-for-android
        run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform
          if [ ! -d python-for-android ]; then
            echo "[patch] Cloning p4a..."
            git clone -b master --single-branch https://github.com/kivy/python-for-android.git
          fi
          cd python-for-android
          echo "[patch] Patching build.py for --no-binary..."
          sed -i "s|'pip', 'install', '--ignore-installed'|'pip', 'install', '--ignore-installed', '--no-binary', ':all:'|g" pythonforandroid/build.py
          sed -i "s|'pip', 'install'|'pip', 'install', '--no-binary', ':all:'|g" pythonforandroid/recipe.py 2>/dev/null || true
          echo "[patch] Done. Verify:"
          grep -c "no-binary" pythonforandroid/build.py pythonforandroid/recipe.py 2>/dev/null || echo "no sed match - env var fallback OK"

      - name: Build APK with Buildozer
        env:
          PIP_NO_BINARY: ':all:'
        run: |
          cd "${GITHUB_WORKSPACE}"
          set -o pipefail
          echo "y" | buildozer android debug 2>&1 | tee /tmp/buildozer_full.log
          echo "BUILDOZER_EXIT_CODE=$?"

      - name: Upload Buildozer Full Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-full-log
          path: /tmp/buildozer_full.log

      - name: Capture Buildozer Tail Error
        if: always()
        run: |
          echo "=== BUILDOZER LOG TAIL (last 200 lines) ===" >> /tmp/build_error.txt
          tail -200 /tmp/buildozer_full.log >> /tmp/build_error.txt 2>/dev/null || echo "No log found"
          echo "" >> /tmp/build_error.txt
          echo "=== GREP ERRORS ===" >> /tmp/build_error.txt
          grep -n -i -E "(error|failed|traceback|exception|command failed|ninja:|BUILD FAILED)" /tmp/buildozer_full.log | tail -50 >> /tmp/build_error.txt 2>/dev/null || true
          cat /tmp/build_error.txt
          echo "Done capturing errors"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: student-checkin-apk
          path: bin/*.apk
          continue-on-error: true
