name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Python and dependencies
        run: |
          sudo rm -f /usr/lib/python3.12/EXTERNALLY-MANAGED
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dev zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip3 install buildozer cython==0.29.37

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q -o cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "Licenses accepted"
        env:
          ANDROID_HOME: ${{ github.workspace }}/.android-sdk

      - name: Build APK with Buildozer
        run: |
          cd "${GITHUB_WORKSPACE}"
          export ANDROID_HOME="${GITHUB_WORKSPACE}/.android-sdk"
          export ANDROIDSDK="${GITHUB_WORKSPACE}/.android-sdk"
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: student-checkin-apk
          path: bin/*.apk
