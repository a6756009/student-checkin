name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Python and dependencies
        run: |
          sudo rm -f /usr/lib/python3.12/EXTERNALLY-MANAGED
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dev zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip3 install buildozer cython==0.29.37

      - name: Build APK with Buildozer
        env:
          ANDROIDSDK: ${{ github.workspace }}/.buildozer/android/platform/android/platform
        run: |
          cd "${GITHUB_WORKSPACE}"
          buildozer android debug 2>&1 | tail -50

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: student-checkin-apk
          path: bin/*.apk
